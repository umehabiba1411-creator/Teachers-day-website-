<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Teachers' Day, Ma'am Kainaat</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4f8;--ink:#3b1636;--soft:#7a4a6e;--card:#ffffff;--rose:#e58fae;--gold:#c98f2b;--sage:#8fb08a;--line:#f2cfdd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f1b;--ink:#fbe8f1;--soft:#d2a9c3;--card:#2b1727;--line:#4a2a43}}
:root[data-theme="dark"]{--bg:#1d0f1b;--ink:#fbe8f1;--soft:#d2a9c3;--card:#2b1727;--line:#4a2a43}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 Nunito,system-ui,sans-serif;overflow-x:hidden}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 22px;position:relative}
.hero h1{font:600 clamp(46px,12vw,96px)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 14px;letter-spacing:-.5px}
  
.hero .to{font:italic 500 clamp(26px,6vw,38px) "Cormorant Garamond",Georgia,serif;color:var(--rose);margin:0}
.hero p.sub{color:var(--soft);max-width:30ch;margin:18px 0 0}
.petal{position:absolute;top:-30px;font-size:22px;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(300deg)}}
.hero .hint{position:absolute;bottom:18px;color:var(--soft);font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 20px 70px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:26px 26px 26px 6px;padding:30px 24px;box-shadow:0 18px 40px -22px var(--rose)}
.letter p{margin:0 0 16px}
.letter .big{font:600 28px/1.25 "Cormorant Garamond",Georgia,serif;color:var(--rose)}
.letter .sign{font:italic 500 25px/1.3 "Cormorant Garamond",Georgia,serif;text-align:right;margin:22px 0 0}
.vid{display:block;width:100%;margin:34px 0 0;border:0;border-radius:20px;background:linear-gradient(135deg,#5a2352,#b4507f);color:#fff;padding:26px 20px;font:inherit;cursor:pointer;text-align:left;display:flex;gap:18px;align-items:center}
.vid:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.play{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center}
.play:after{content:"";border-left:20px solid #b4507f;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.vid b{display:block;font:600 24px/1.2 "Cormorant Garamond",Georgia,serif}
.vid span{font-size:14px;opacity:.9}
.modal{position:fixed;inset:0;background:rgba(20,6,18,.88);display:none;place-items:center;z-index:9;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.modal.on{display:grid}
.player{width:min(92vw,330px);aspect-ratio:9/16;max-height:88vh;background:#1d0f1b;border-radius:26px;overflow:hidden;position:relative;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;object-position:top;transform:scale(1.02)}
.slide.on img{animation:pan 1.6s ease-in-out forwards}
@keyframes pan{from{object-position:50% 0;transform:scale(1.02)}to{object-position:50% 100%;transform:scale(1.12)}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 22px;background:linear-gradient(transparent,rgba(20,6,18,.92));font:italic 500 22px/1.3 "Cormorant Garamond",Georgia,serif;text-align:center}
.bar{position:absolute;top:10px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;z-index:2}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.end{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:linear-gradient(160deg,#5a2352,#b4507f);z-index:3}
.end.on{display:flex}
.end h3{font:600 36px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
.end button{margin-top:18px;border:1px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:8px 22px;font:inherit;cursor:pointer}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#3b1636;font-size:22px;cursor:pointer;z-index:10}
@media (prefers-reduced-motion:reduce){.petal{display:none}.slide.on img{animation:none}}

body.locked header,body.locked main{display:none}
#gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 20%,#7a2f6a,#2a0f27);color:#fff;transition:opacity .9s,transform .9s}
#gate.out{opacity:0;transform:scale(1.15);pointer-events:none}
#gate .face{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 35%;border:4px solid #fff;box-shadow:0 0 0 8px rgba(255,255,255,.18);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 18px rgba(255,255,255,.08)}}
#gate h2{font:600 34px/1.15 "Cormorant Garamond",Georgia,serif;margin:22px 0 6px}
#gate p{margin:0 0 18px;opacity:.85}
#pw{width:190px;text-align:center;font:600 28px Nunito,sans-serif;letter-spacing:12px;padding:10px 10px 10px 22px;border-radius:14px;border:2px solid #fff;background:rgba(255,255,255,.1);color:#fff}
#pw:focus-visible,#go:focus-visible,.g:focus-visible,.bl:focus-visible,#bird:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#go{display:block;margin:16px auto 0;border:0;border-radius:99px;background:#fff;color:#5a2352;font:600 17px Nunito,sans-serif;padding:11px 34px;cursor:pointer}
#err{min-height:24px;margin-top:10px;color:#ffd0df}
.shake{animation:sh .45s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fx{position:fixed;z-index:50;pointer-events:none;font-size:24px;animation:fx 1.3s ease-out forwards}
@keyframes fx{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6);opacity:0}}
section.box{margin-top:44px;text-align:center}
section.box h2{font:600 34px/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
section.box>p{color:var(--soft);margin:0 0 18px}
.msg{min-height:56px;margin-top:14px;font:italic 500 22px/1.4 "Cormorant Garamond",Georgia,serif;color:var(--rose)}
.gifts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.g{width:74px;height:74px;font-size:42px;border:1px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;transition:transform .2s}
.g:active{transform:scale(.88)}.g.open{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.3) rotate(-10deg)}}
#bird{font-size:84px;background:none;border:0;cursor:pointer;line-height:1}
#bird.hop{animation:hop .5s}@keyframes hop{40%{transform:translateY(-26px) rotate(-8deg)}}
.sky{position:relative;height:300px;border-radius:24px;background:linear-gradient(#ffd9e8,#fff4f8);border:1px solid var(--line);overflow:hidden}
:root[data-theme="dark"] .sky{background:linear-gradient(#4a2a43,#2b1727)}
.bl{position:absolute;bottom:-70px;font-size:56px;background:none;border:0;cursor:pointer;animation:up linear infinite}
@keyframes up{to{bottom:310px}}
.pic{width:170px;height:170px;border-radius:50%;object-fit:cover;object-position:50% 35%;border:4px solid var(--rose);margin-bottom:12px}
.close{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 22px;margin-top:40px;text-align:center;box-shadow:0 18px 40px -22px var(--rose)}
.close p{margin:0 0 14px}
.letter p{opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}.letter p.in{opacity:1;transform:none}
#hc{touch-action:none;width:300px;max-width:100%;cursor:crosshair}
.beat{animation:beat 1.3s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.07)}}
#hk{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(circle,#7a2f6a,#2a0f27);color:#fff}
#hk.on{display:flex}#hk .hk{font:600 clamp(70px,22vw,120px)/1 "Cormorant Garamond",Georgia,serif}
#hk h3{font:italic 500 28px/1.3 "Cormorant Garamond",Georgia,serif;margin:14px 0 6px}#hk small{opacity:.7}
</style></head><body class="locked">
